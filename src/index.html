<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="bootstrap.min.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Tool</title>
    <script src="preact.min.js"></script>
    <script src="hooks.min.js"></script>
    <script src="htm.min.js"></script>
    <script src="ejs.js"></script>
    <script src="marked.min.js"></script>
    <link rel="stylesheet" href="highlight-github-dark.min.css" />
    <script src="highlight.min.js"></script>
    <script type="module" src="/main.js" defer></script>
    
    <style>

      /* ── Markdown rendered content ── */
      .md-content { font-size: 0.92rem; line-height: 1.6; }
      .md-content p { margin: 0 0 0.6em; }
      .md-content p:last-child { margin-bottom: 0; }
      .md-content h1,.md-content h2,.md-content h3,
      .md-content h4,.md-content h5,.md-content h6 { margin: 0.8em 0 0.4em; font-weight: 600; }
      .md-content ul,.md-content ol { padding-left: 1.4em; margin: 0 0 0.6em; }
      .md-content li { margin-bottom: 0.2em; }
      .md-content code:not(pre code) {
        background: rgba(0,0,0,.08); border-radius: 3px;
        padding: 0.1em 0.35em; font-size: 0.88em; font-family: monospace;
      }
      .md-content pre {
        margin: 0.6em 0; border-radius: 6px; overflow-x: auto;
        padding: 0; /* highlight.js sets its own padding */
      }
      .md-content pre code.hljs { border-radius: 6px; font-size: 0.85em; }
      .md-content blockquote {
        border-left: 3px solid #adb5bd; margin: 0.6em 0;
        padding: 0.2em 0.8em; color: #6c757d;
      }
      .md-content table { border-collapse: collapse; width: 100%; margin: 0.6em 0; }
      .md-content th,.md-content td {
        border: 1px solid #dee2e6; padding: 0.3em 0.6em;
      }
      .md-content th { background: #f1f3f5; }
      .md-content a { color: #0d6efd; }
      /* user bubbles: keep inline code readable on blue bg */
      .md-content.user-md code:not(pre code) { background: rgba(255,255,255,.2); }

      #image img{

        display: block;
        max-width: 100%;
        max-height: 100vh;
        height: auto;
        width: auto;
        margin: 0 auto;
        object-fit: contain;
      }



      @media print {

        nav {
          display: none !important;
        }

      }

      #image svg{

        display: block;
        margin-left: auto;
        margin-right: auto;
      }

      body{
        background-color: transparent;
      }

    </style>
  </head>

  <body>
    <div id="app"></div>
  </body>
</html>
